<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raycaster Maze (Emscripten)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Raycaster Maze</h1>
      <p id="hud">WASD move, arrows turn — find the east exit gap</p>
      <div class="canvas-wrap">
        <canvas id="screen" width="640" height="480"></canvas>
        <div id="win-overlay" class="overlay hidden" aria-hidden="true">
          <div class="overlay-panel">
            <p class="overlay-title">Escaped!</p>
            <button id="next-level" type="button">Next level</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="regenerate" type="button">Regenerate maze</button>
      </div>
      <p id="status">Loading WASM module…</p>
    </main>
    <script src="maze.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
